<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS:GO Case Opening</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }
        /* Основной контейнер игры */
        .game-container {
            max-width: 800px;
            margin: 60vh auto 50px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        /* Баланс и счетчик кейсов */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: bold;
        }
        .balance {
            color: #4ade80;
        }
        .cases-count {
            color: #fbbf24;
        }
        /* Кнопка открытия */
        .open-btn {
            width: 100%;
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
            margin-bottom: 30px;
        }
        .open-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.6);
        }
        .open-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        /* Кейс */
        .case-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }
        .case-image {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #374151 0%, #1f2937 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .case-image.opening {
            animation: shake 0.5s ease-in-out infinite;
        }
        .case-image.opened {
            animation: openCase 0.5s ease forwards;
        }
        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }
        @keyframes openCase {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }
        /* Результат открытия */
        .result-container {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-item {
            padding: 20px 30px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 15px;
            min-width: 300px;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        .result-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .result-rarity {
            font-size: 16px;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        .result-price {
            font-size: 20px;
            font-weight: bold;
            color: #4ade80;
        }
        /* Редкости */
        .common { background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%); }
        .rare { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); }
        .legendary { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        /* Кнопка инвентаря */
        .inventory-btn {
            width: 100%;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        .inventory-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }
        /* Экран инвентаря */
        .inventory-screen {
            display: none;
        }
        .inventory-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .back-btn {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            max-height: 500px;
            overflow-y: auto;
            padding: 10px;
        }
        .inventory-item {
            padding: 15px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        .inventory-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        .item-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .item-rarity {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        .item-price {
            font-size: 16px;
            font-weight: bold;
            color: #4ade80;
            margin-bottom: 10px;
        }
        .sell-btn {
            width: 100%;
            padding: 8px 15px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .sell-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }
        .empty-inventory {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
        }
        /* Уведомление о пополнении кейсов */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            transform: translateX(400px);
            transition: transform 0.5s ease;
            z-index: 1000;
        }
        .notification.show {
            transform: translateX(0);
        }
        /* Скроллбар для инвентаря */
        .inventory-grid::-webkit-scrollbar {
            width: 8px;
        }
        .inventory-grid::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        .inventory-grid::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }
        .inventory-grid::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <!-- Основной контейнер игры -->
    <div class="game-container">
        <!-- Статистика -->
        <div class="stats-bar">
            <div class="stat-item balance">
                <span>💰</span>
                <span id="balance">1000</span>$
            </div>
            <div class="stat-item cases-count">
                <span>📦</span>
                <span id="casesCount">5</span> кейсов
            </div>
        </div>
        <!-- Главный экран -->
        <div id="mainScreen">
            <!-- Кнопка открытия -->
            <button class="open-btn" id="openBtn" onclick="openCase()">
                🔓 Открыть кейс
            </button>
            <!-- Кейс -->
            <div class="case-container">
                <div class="case-image" id="caseImage">📦</div>
            </div>
            <!-- Результат -->
            <div class="result-container" id="resultContainer">
                <div class="result-item" id="resultItem">
                    <div class="result-name" id="resultName"></div>
                    <div class="result-rarity" id="resultRarity"></div>
                    <div class="result-price" id="resultPrice"></div>
                </div>
            </div>
            <!-- Кнопка инвентаря -->
            <button class="inventory-btn" onclick="showInventory()">
                🎒 Открыть инвентарь
            </button>
        </div>
        <!-- Экран инвентаря -->
        <div class="inventory-screen" id="inventoryScreen">
            <div class="inventory-header">
                <h2>🎒 Инвентарь</h2>
                <button class="back-btn" onclick="hideInventory()">← Назад</button>
            </div>
            <div class="inventory-grid" id="inventoryGrid">
                <!-- Сюда будут добавляться предметы -->
            </div>
        </div>
    </div>
    <!-- Уведомление -->
    <div class="notification" id="notification">
        +1 кейс получен!
    </div>
    <script>
        // === КОНФИГУРАЦИЯ ИГРЫ ===
        
        // База данных скинов с разной редкостью
        const skins = [
            // Обычные (70% шанс, низкая цена)
            { name: "P250 | Песчаная дюна", rarity: "common", price: 15, chance: 25 },
            { name: "MP9 | Шторм", rarity: "common", price: 18, chance: 25 },
            { name: "SCAR-20 | Армейский", rarity: "common", price: 20, chance: 20 },
            
            // Редкие (20% шанс, средняя цена)
            { name: "AK-47 | Красная линия", rarity: "rare", price: 150, chance: 10 },
            { name: "M4A4 | Азимов", rarity: "rare", price: 180, chance: 10 },
            { name: "AWP | Электрический ультра", rarity: "rare", price: 200, chance: 8 },
            { name: "USP-S | Коррозия", rarity: "rare", price: 120, chance: 12 },
            
            // Легендарные (10% шанс, высокая цена)
            { name: "Karambit | Градиент", rarity: "legendary", price: 1500, chance: 4 },
            { name: "M9 Bayonet | Лоре", rarity: "legendary", price: 2000, chance: 3 },
            { name: "AK-47 | Огонь и вода", rarity: "legendary", price: 1200, chance: 5 },
            { name: "AWP | Драконий стиль", rarity: "legendary", price: 2500, chance: 2 }
        ];
        // Состояние игры
        let gameState = {
            balance: 1000,
            cases: 5,
            inventory: [],
            isOpening: false
        };
        // === ФУНКЦИИ ОТКРЫТИЯ КЕЙСА ===
        
        // Выбор случайного скина с учетом шансов
        function getRandomSkin() {
            const rand = Math.random() * 100;
            let cumulativeChance = 0;
            
            for (const skin of skins) {
                cumulativeChance += skin.chance;
                if (rand <= cumulativeChance) {
                    return skin;
                }
            }
            
            return skins[0]; // Запасной вариант
        }
        // Открытие кейса
        async function openCase() {
            if (gameState.isOpening || gameState.cases <= 0) return;
            gameState.isOpening = true;
            const openBtn = document.getElementById('openBtn');
            const caseImage = document.getElementById('caseImage');
            const resultContainer = document.getElementById('resultContainer');
            // Отключаем кнопку
            openBtn.disabled = true;
            openBtn.textContent = "⏳ Открытие...";
            // Анимация тряски кейса
            caseImage.classList.add('opening');
            // Ждем 2 секунды
            await new Promise(resolve => setTimeout(resolve, 2000));
            // Останавливаем тряску и показываем анимацию открытия
            caseImage.classList.remove('opening');
            caseImage.classList.add('opened');
            // Получаем случайный скин
            const droppedSkin = getRandomSkin();
            // Добавляем в инвентарь
            const newItem = {
                ...droppedSkin,
                id: Date.now(),
                obtainedAt: new Date().toLocaleString()
            };
            gameState.inventory.push(newItem);
            // Ждем завершения анимации
            await new Promise(resolve => setTimeout(resolve, 500));
            // Показываем результат
            showResult(newItem);
            // Уменьшаем количество кейсов
            gameState.cases--;
            updateStats();
            // Включаем кнопку снова
            openBtn.disabled = false;
            openBtn.textContent = "🔓 Открыть кейс";
            gameState.isOpening = false;
        }
        // Показ результата
        function showResult(item) {
            const resultContainer = document.getElementById('resultContainer');
            const resultItem = document.getElementById('resultItem');
            const resultName = document.getElementById('resultName');
            const resultRarity = document.getElementById('resultRarity');
            const resultPrice = document.getElementById('resultPrice');
            // Убираем старые классы редкости
            resultItem.className = 'result-item';
            resultItem.classList.add(item.rarity);
            resultName.textContent = item.name;
            resultRarity.textContent = getRarityName(item.rarity);
            resultPrice.textContent = `${item.price}$`;
            resultContainer.style.display = 'flex';
            // Скрываем результат через 3 секунды
            setTimeout(() => {
                resultContainer.style.display = 'none';
                document.getElementById('caseImage').classList.remove('opened');
                document.getElementById('caseImage').textContent = '📦';
            }, 3000);
        }
        // Название редкости
        function getRarityName(rarity) {
            const names = {
                common: "⭐ Обычное",
                rare: "🔷 Редкое",
                legendary: "👑 Легендарное"
            };
            return names[rarity] || rarity;
        }
        // === ФУНКЦИИ ИНВЕНТАРЯ ===
        
        // Показать инвентарь
        function showInventory() {
            document.getElementById('mainScreen').style.display = 'none';
            document.getElementById('inventoryScreen').style.display = 'block';
            renderInventory();
        }
        // Скрыть инвентарь
        function hideInventory() {
            document.getElementById('inventoryScreen').style.display = 'none';
            document.getElementById('mainScreen').style.display = 'block';
        }
        // Отрисовка инвентаря
        function renderInventory() {
            const inventoryGrid = document.getElementById('inventoryGrid');
            
            if (gameState.inventory.length === 0) {
                inventoryGrid.innerHTML = '<div class="empty-inventory">Инвентарь пуст 😢<br>Откройте кейс!</div>';
                return;
            }
            inventoryGrid.innerHTML = gameState.inventory.map(item => `
                <div class="inventory-item ${item.rarity}">
                    <div class="item-name">${item.name}</div>
                    <div class="item-rarity">${getRarityName(item.rarity)}</div>
                    <div class="item-price">${item.price}$</div>
                    <button class="sell-btn" onclick="sellItem(${item.id})">
                        💰 Продать за ${item.price}$
                    </button>
                </div>
            `).join('');
        }
        // Продажа предмета
        function sellItem(itemId) {
            const itemIndex = gameState.inventory.findIndex(item => item.id === itemId);
            if (itemIndex === -1) return;
            const item = gameState.inventory[itemIndex];
            gameState.balance += item.price;
            gameState.inventory.splice(itemIndex, 1);
            updateStats();
            renderInventory();
            // Анимация получения денег
            showNotification(`+${item.price}$ получено!`, 'success');
        }
        // === ОБНОВЛЕНИЕ СТАТИСТИКИ ===
        
        function updateStats() {
            document.getElementById('balance').textContent = gameState.balance;
            document.getElementById('casesCount').textContent = gameState.cases;
            
            const openBtn = document.getElementById('openBtn');
            if (gameState.cases <= 0) {
                openBtn.disabled = true;
                openBtn.textContent = "❌ Нет кейсов";
            } else {
                openBtn.disabled = false;
                openBtn.textContent = "🔓 Открыть кейс";
            }
        }
        // === ПОПОЛНЕНИЕ КЕЙСОВ ===
        
        // Пополнение кейсов каждые 2 минуты
        setInterval(() => {
            const additionalCases = Math.floor(Math.random() * 3) + 1; // 1-3 кейса
            gameState.cases += additionalCases;
            updateStats();
            
            showNotification(`+${additionalCases} кейс(а) получено!`);
        }, 2 * 60 * 1000); // 2 минуты
        // Показ уведомления
        function showNotification(message, type = 'info') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
        // === ИНИЦИАЛИЗАЦИЯ ===
        
        updateStats();
        renderInventory();
    </script>
</body>
</html>

            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        .inventory-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }
        /* Экран инвентаря */
        .inventory-screen {
            display: none;
        }
        .inventory-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .back-btn {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            max-height: 500px;
            overflow-y: auto;
            padding: 10px;
        }
        .inventory-item {
            padding: 15px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        .inventory-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        .item-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .item-rarity {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        .item-price {
            font-size: 16px;
            font-weight: bold;
            color: #4ade80;
            margin-bottom: 10px;
        }
        .sell-btn {
            width: 100%;
            padding: 8px 15px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .sell-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }
        .empty-inventory {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
        }
        /* Уведомление о пополнении кейсов */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            transform: translateX(400px);
            transition: transform 0.5s ease;
            z-index: 1000;
        }
        .notification.show {
            transform: translateX(0);
        }
        /* Скроллбар для инвентаря */
        .inventory-grid::-webkit-scrollbar {
            width: 8px;
        }
        .inventory-grid::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        .inventory-grid::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }
        .inventory-grid::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <!-- Основной контейнер игры -->
    <div class="game-container">
        <!-- Статистика -->
        <div class="stats-bar">
            <div class="stat-item balance">
                <span>💰</span>
                <span id="balance">1000</span>$
            </div>
            <div class="stat-item cases-count">
                <span>📦</span>
                <span id="casesCount">5</span> кейсов
            </div>
        </div>
        <!-- Главный экран -->
        <div id="mainScreen">
            <!-- Кнопка открытия -->
            <button class="open-btn" id="openBtn" onclick="openCase()">
                🔓 Открыть кейс
            </button>
            <!-- Кейс -->
            <div class="case-container">
                <div class="case-image" id="caseImage">📦</div>
            </div>
            <!-- Результат -->
            <div class="result-container" id="resultContainer">
                <div class="result-item" id="resultItem">
                    <div class="result-name" id="resultName"></div>
                    <div class="result-rarity" id="resultRarity"></div>
                    <div class="result-price" id="resultPrice"></div>
                </div>
            </div>
            <!-- Кнопка инвентаря -->
            <button class="inventory-btn" onclick="showInventory()">
                🎒 Открыть инвентарь
            </button>
        </div>
        <!-- Экран инвентаря -->
        <div class="inventory-screen" id="inventoryScreen">
            <div class="inventory-header">
                <h2>🎒 Инвентарь</h2>
                <button class="back-btn" onclick="hideInventory()">← Назад</button>
            </div>
            <div class="inventory-grid" id="inventoryGrid">
                <!-- Сюда будут добавляться предметы -->
            </div>
        </div>
    </div>
    <!-- Уведомление -->
    <div class="notification" id="notification">
        +1 кейс получен!
    </div>
    <script>
        // === КОНФИГУРАЦИЯ ИГРЫ ===
        
        // База данных скинов с разной редкостью
        const skins = [
            // Обычные (70% шанс, низкая цена)
            { name: "P250 | Песчаная дюна", rarity: "common", price: 15, chance: 25 },
            { name: "MP9 | Шторм", rarity: "common", price: 18, chance: 25 },
            { name: "SCAR-20 | Армейский", rarity: "common", price: 20, chance: 20 },
            
            // Редкие (20% шанс, средняя цена)
            { name: "AK-47 | Красная линия", rarity: "rare", price: 150, chance: 10 },
            { name: "M4A4 | Азимов", rarity: "rare", price: 180, chance: 10 },
            { name: "AWP | Электрический ультра", rarity: "rare", price: 200, chance: 8 },
            { name: "USP-S | Коррозия", rarity: "rare", price: 120, chance: 12 },
            
            // Легендарные (10% шанс, высокая цена)
            { name: "Karambit | Градиент", rarity: "legendary", price: 1500, chance: 4 },
            { name: "M9 Bayonet | Лоре", rarity: "legendary", price: 2000, chance: 3 },
            { name: "AK-47 | Огонь и вода", rarity: "legendary", price: 1200, chance: 5 },
            { name: "AWP | Драконий стиль", rarity: "legendary", price: 2500, chance: 2 }
        ];
        // Состояние игры
        let gameState = {
            balance: 1000,
            cases: 5,
            inventory: [],
            isOpening: false
        };
        // === ФУНКЦИИ ОТКРЫТИЯ КЕЙСА ===
        
        // Выбор случайного скина с учетом шансов
        function getRandomSkin() {
            const rand = Math.random() * 100;
            let cumulativeChance = 0;
            
            for (const skin of skins) {
                cumulativeChance += skin.chance;
                if (rand <= cumulativeChance) {
                    return skin;
                }
            }
            
            return skins[0]; // Запасной вариант
        }
        // Открытие кейса
        async function openCase() {
            if (gameState.isOpening || gameState.cases <= 0) return;
            gameState.isOpening = true;
            const openBtn = document.getElementById('openBtn');
            const caseImage = document.getElementById('caseImage');
            const resultContainer = document.getElementById('resultContainer');
            // Отключаем кнопку
            openBtn.disabled = true;
            openBtn.textContent = "⏳ Открытие...";
            // Анимация тряски кейса
            caseImage.classList.add('opening');
            // Ждем 2 секунды
            await new Promise(resolve => setTimeout(resolve, 2000));
            // Останавливаем тряску и показываем анимацию открытия
            caseImage.classList.remove('opening');
            caseImage.classList.add('opened');
            // Получаем случайный скин
            const droppedSkin = getRandomSkin();
            // Добавляем в инвентарь
            const newItem = {
                ...droppedSkin,
                id: Date.now(),
                obtainedAt: new Date().toLocaleString()
            };
            gameState.inventory.push(newItem);
            // Ждем завершения анимации
            await new Promise(resolve => setTimeout(resolve, 500));
            // Показываем результат
            showResult(newItem);
            // Уменьшаем количество кейсов
            gameState.cases--;
            updateStats();
            // Включаем кнопку снова
            openBtn.disabled = false;
            openBtn.textContent = "🔓 Открыть кейс";
            gameState.isOpening = false;
        }
        // Показ результата
        function showResult(item) {
            const resultContainer = document.getElementById('resultContainer');
            const resultItem = document.getElementById('resultItem');
            const resultName = document.getElementById('resultName');
            const resultRarity = document.getElementById('resultRarity');
            const resultPrice = document.getElementById('resultPrice');
            // Убираем старые классы редкости
            resultItem.className = 'result-item';
            resultItem.classList.add(item.rarity);
            resultName.textContent = item.name;
            resultRarity.textContent = getRarityName(item.rarity);
            resultPrice.textContent = `${item.price}$`;
            resultContainer.style.display = 'flex';
            // Скрываем результат через 3 секунды
            setTimeout(() => {
                resultContainer.style.display = 'none';
                document.getElementById('caseImage').classList.remove('opened');
                document.getElementById('caseImage').textContent = '📦';
            }, 3000);
        }
        // Название редкости
        function getRarityName(rarity) {
            const names = {
                common: "⭐ Обычное",
                rare: "🔷 Редкое",
                legendary: "👑 Легендарное"
            };
            return names[rarity] || rarity;
        }
        // === ФУНКЦИИ ИНВЕНТАРЯ ===
        
        // Показать инвентарь
        function showInventory() {
            document.getElementById('mainScreen').style.display = 'none';
            document.getElementById('inventoryScreen').style.display = 'block';
            renderInventory();
        }
        // Скрыть инвентарь
        function hideInventory() {
            document.getElementById('inventoryScreen').style.display = 'none';
            document.getElementById('mainScreen').style.display = 'block';
        }
        // Отрисовка инвентаря
        function renderInventory() {
            const inventoryGrid = document.getElementById('inventoryGrid');
            
            if (gameState.inventory.length === 0) {
                inventoryGrid.innerHTML = '<div class="empty-inventory">Инвентарь пуст 😢<br>Откройте кейс!</div>';
                return;
            }
            inventoryGrid.innerHTML = gameState.inventory.map(item => `
                <div class="inventory-item ${item.rarity}">
                    <div class="item-name">${item.name}</div>
                    <div class="item-rarity">${getRarityName(item.rarity)}</div>
                    <div class="item-price">${item.price}$</div>
                    <button class="sell-btn" onclick="sellItem(${item.id})">
                        💰 Продать за ${item.price}$
                    </button>
                </div>
            `).join('');
        }
        // Продажа предмета
        function sellItem(itemId) {
            const itemIndex = gameState.inventory.findIndex(item => item.id === itemId);
            if (itemIndex === -1) return;
            const item = gameState.inventory[itemIndex];
            gameState.balance += item.price;
            gameState.inventory.splice(itemIndex, 1);
            updateStats();
            renderInventory();
            // Анимация получения денег
            showNotification(`+${item.price}$ получено!`, 'success');
        }
        // === ОБНОВЛЕНИЕ СТАТИСТИКИ ===
        
        function updateStats() {
            document.getElementById('balance').textContent = gameState.balance;
            document.getElementById('casesCount').textContent = gameState.cases;
            
            const openBtn = document.getElementById('openBtn');
            if (gameState.cases <= 0) {
                openBtn.disabled = true;
                openBtn.textContent = "❌ Нет кейсов";
            } else {
                openBtn.disabled = false;
                openBtn.textContent = "🔓 Открыть кейс";
            }
        }
        // === ПОПОЛНЕНИЕ КЕЙСОВ ===
        
        // Пополнение кейсов каждые 2 минуты
        setInterval(() => {
            const additionalCases = Math.floor(Math.random() * 3) + 1; // 1-3 кейса
            gameState.cases += additionalCases;
            updateStats();
            
            showNotification(`+${additionalCases} кейс(а) получено!`);
        }, 2 * 60 * 1000); // 2 минуты
        // Показ уведомления
        function showNotification(message, type = 'info') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
        // === ИНИЦИАЛИЗАЦИЯ ===
        
        updateStats();
        renderInventory();
    </script>
</body>
</html>
